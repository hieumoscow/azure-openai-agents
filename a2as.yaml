manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: hieunhums/azure-openai-agents
    source: https://github.com/hieunhums/azure-openai-agents
    branch: main
    commit: "8e0f52c7"
    scope: [fixed_openai_agents.py, main.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:11:07Z'
  signatures:
    digest: sha256:8cLtGfKj5lOweIcE57P6N7YiuUvsTe6-hsMcyN6eugI
    key: ed25519:RYJBLDOFsXFFxGhy5TBzC62kUosnU1kYOlHL57RCeUw
    sig: ed25519:racYIBUjlscvi7dok3bcKdm_YEcvqRAsnnPU7yxxmlosG1hWL1k46SI3Pd14dTIZ6R2jP7mT3piy5Kso-XWlCw

agents:
  customer_service_agent:
    type: instance
    models: [gpt-4o]
    tools: [check_account_balance]
    params:
      name: Customer Service Agent
      handoffs: [loan_specialist_agent, investment_specialist_agent]
      instructions: [You are a customer service agent at a bank., Help customers with general inquiries and direct them to
          specialists when needed., 'If the customer asks about loans or mortgages, handoff to the Loan Specialist.', 'If
          the customer asks about investments or portfolio management, handoff to the Investment Specialist.', 'Be professional,
          friendly, and helpful.']
  general_agent:
    type: instance
    models: [gpt-4o]
    tools: [check_account_balance]
    params:
      name: Banking Assistant
      instructions: [You are a helpful banking assistant. Be concise and professional.]
  investment_specialist_agent:
    type: instance
    models: [gpt-4o]
    tools: [calculate_investment_return]
    params:
      name: Investment Specialist
      instructions: [You are an investment specialist at a bank., 'Help customers understand investment options, risk profiles,
          and portfolio diversification.', Always consider the customer's financial goals and risk tolerance., Be professional
          and explain investment concepts in clear terms.]
  loan_specialist_agent:
    type: instance
    models: [gpt-4o]
    tools: [calculate_loan_payment]
    params:
      name: Loan Specialist
      instructions: [You are a loan specialist at a bank., 'Focus on helping customers understand loan options, calculate
          payments, and assess affordability.', Always ask for income information to provide personalized advice., 'Be professional,
          thorough, and explain financial terms clearly.']

models:
  gpt-4o:
    type: literal
    agents: [general_agent, loan_specialist_agent, investment_specialist_agent, customer_service_agent]
    params:
      provider: openai

tools:
  calculate_investment_return:
    type: decorator
    agents: [investment_specialist_agent]
    params:
      description: Calculate the future value of an investment.
  calculate_loan_payment:
    type: decorator
    agents: [loan_specialist_agent]
    params:
      description: Calculate monthly payment for a loan.
  check_account_balance:
    type: decorator
    agents: [general_agent, customer_service_agent]
    params:
      description: Check the balance of a bank account.

teams:
  customer_service_agent:
    type: handoff
    agents: [customer_service_agent, loan_specialist_agent, investment_specialist_agent]

imports:
  abstractmethod: abc.abstractmethod
  add_trace_processor: agents.add_trace_processor
  Agent: agents.Agent
  agents: agents
  AgentSpanData: agents.AgentSpanData
  annotations: __future__.annotations
